name: volunteering
description: "Платформа для волонтеров Кыргызстана - Ыктыярчы"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  intl: ^0.20.2
  dio: ^5.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.0
  image_picker: ^1.1.2
  flutter_native_splash: ^2.3.10
  permission_handler: ^11.3.0
  pdf: ^3.11.1
  printing: ^5.13.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^18.0.1
  share_plus: ^12.0.2
  cached_network_image: ^3.4.1
  skeletonizer: ^2.1.3



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

  # Testing dependencies
  mockito: ^5.4.4
  build_runner: ^2.4.8
  http_mock_adapter: ^0.6.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icons/

# Flutter Native Splash Screen Configuration
flutter_native_splash:
  # Brand color - Green
  color: "#4CAF50"

  # Logo image
  # 512x512px PNG with transparent background
  image: assets/images/logo.png

  # Android 12+ specific settings
  android_12:
    color: "#4CAF50"
    image: assets/images/logo.png

  # Platform specific settings
  android: true
  ios: true
  web: true

  # Fullscreen mode
  fullscreen: true

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"

  # Android adaptive icon (Android 8.0+)
  adaptive_icon_background: "#4CAF50"
  adaptive_icon_foreground: "assets/icons/app_icon.png"

  # Remove default Flutter icon
  remove_alpha_ios: true

  # Web (optional)
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#4CAF50"
    theme_color: "#4CAF50"

  # Windows (optional)
  windows:
    generate: true
    image_path: "assets/icons/app_icon.png"
    icon_size: 48
