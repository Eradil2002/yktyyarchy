# Render Blueprint — бесплатный бэкенд Ыктыярчы + PostgreSQL
services:
  - type: web
    name: yktyyarchy-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && (python manage.py create_test_data || true) && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: yktyyarchy-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://eradil2002.github.io
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: FRONTEND_URL
        value: https://eradil2002.github.io/yktyyarchy
      # Секретный путь к админке: Render сгенерирует случайное значение (смотрите в Environment)
      - key: ADMIN_URL
        generateValue: true
      # Демо-вход test/test. Перед реальным запуском поставьте "False" в Render → Environment
      - key: DEMO_ACCOUNT_ENABLED
        value: "True"

databases:
  - name: yktyyarchy-db
    plan: free
    databaseName: volunteering_db
