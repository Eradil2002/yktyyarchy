name: Build and Deploy

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  FLUTTER_VERSION: '3.19.0'
  JAVA_VERSION: '17'

jobs:
  version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      full_version: ${{ steps.version.outputs.full_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          # Get version from pubspec.yaml
          VERSION=$(grep "version:" pubspec.yaml | awk '{print $2}')
          VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)

          # Build number = total commit count
          BUILD_NUMBER=$(git rev-list --count HEAD)

          FULL_VERSION="${VERSION_NAME}+${BUILD_NUMBER}"

          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT

          echo "📦 Version: $FULL_VERSION"

  build-android:
    name: Build Android AAB
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze code
        run: flutter analyze

      - name: Decode keystore
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/upload-keystore.jks

      - name: Create key.properties
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=upload
          storeFile=../upload-keystore.jks
          EOF

      - name: Build AAB
        run: |
          flutter build appbundle \
            --release \
            --build-name=${{ needs.version.outputs.version_name }} \
            --build-number=${{ needs.version.outputs.build_number }} \
            --dart-define=API_URL=${{ secrets.API_URL || 'http://10.0.2.2:8000/api' }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ needs.version.outputs.full_version }}.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload mapping file
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ needs.version.outputs.full_version }}.txt
          path: build/app/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Build APK (for testing)
        if: github.event_name == 'pull_request'
        run: |
          flutter build apk \
            --release \
            --build-name=${{ needs.version.outputs.version_name }} \
            --build-number=${{ needs.version.outputs.build_number }}

      - name: Upload APK artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ needs.version.outputs.full_version }}.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

  deploy-internal:
    name: Deploy to Internal Testing
    needs: [version, build-android]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release-${{ needs.version.outputs.full_version }}.aab

      - name: Download mapping
        uses: actions/download-artifact@v4
        with:
          name: mapping-${{ needs.version.outputs.full_version }}.txt

      - name: Upload to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: kg.volunteers.app
          releaseFiles: app-release.aab
          track: internal
          status: completed
          mappingFile: mapping.txt

  deploy-production:
    name: Deploy to Production
    needs: [version, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release-${{ needs.version.outputs.full_version }}.aab

      - name: Download mapping
        uses: actions/download-artifact@v4
        with:
          name: mapping-${{ needs.version.outputs.full_version }}.txt

      - name: Create Release Notes
        run: |
          mkdir -p whatsnew
          echo "Обновление ${{ needs.version.outputs.version_name }}" > whatsnew/whatsnew-ru-RU
          echo "Жаңыртуу ${{ needs.version.outputs.version_name }}" > whatsnew/whatsnew-ky-KG
          echo "Update ${{ needs.version.outputs.version_name }}" > whatsnew/whatsnew-en-US

      - name: Upload to Play Store (Production)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: kg.volunteers.app
          releaseFiles: app-release.aab
          track: production
          status: completed
          inAppUpdatePriority: 2
          userFraction: 0.1
          mappingFile: mapping.txt
          whatsNewDirectory: whatsnew/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            app-release.aab
            mapping.txt
          body: |
            ## Версия ${{ needs.version.outputs.version_name }}

            Build Number: ${{ needs.version.outputs.build_number }}

            ### Установка
            Скачайте AAB и загрузите в Play Console или установите через Internal Testing.

            ### Важно
            Сохраните mapping.txt для расшифровки crash reports!
          draft: false
          prerelease: false

  notify:
    name: Notify on Slack
    needs: [version, build-android]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify Success
        if: success()
        run: |
          echo "✅ Build successful: ${{ needs.version.outputs.full_version }}"
          # Добавьте Slack webhook если нужно

      - name: Notify Failure
        if: failure()
        run: |
          echo "❌ Build failed: ${{ needs.version.outputs.full_version }}"
          # Добавьте Slack webhook если нужно
