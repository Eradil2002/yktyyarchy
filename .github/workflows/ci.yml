# Ыктыярчы.kg — CI/CD Pipeline
# Runs on every push to main and on pull requests.
# Handles: lint, test, build APK/AAB, and auto-increment version.

name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'

jobs:
  # ──────────────────────────────────────────────
  # 1. Analyze & Test
  # ──────────────────────────────────────────────
  analyze:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: flutter
          name: flutter-coverage
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov
          lcov --summary coverage/lcov.info | grep "lines" | awk '{print $2}' | sed 's/%//' > coverage_percent.txt
          COVERAGE=$(cat coverage_percent.txt)
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 60% threshold"
            exit 1
          fi

  # ──────────────────────────────────────────────
  # 2. Build Android (APK + AAB)
  # ──────────────────────────────────────────────
  build-android:
    name: Build Android
    needs: analyze
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      # Auto-increment build number based on GitHub run number
      - name: Set build number
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_ENV

      # Decode signing key from secrets
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks

      - name: Create key.properties
        if: env.KEY_ALIAS != ''
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # Build debug APK (always works, no signing needed)
      - name: Build Debug APK
        run: |
          flutter build apk --debug \
            --build-number=${{ env.BUILD_NUMBER }} \
            --dart-define=API_URL=https://api.yktyyarchy.kg/api

      # Build release AAB (only if signing is configured)
      - name: Build Release AAB
        if: env.KEY_ALIAS != ''
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          flutter build appbundle --release \
            --build-number=${{ env.BUILD_NUMBER }} \
            --dart-define=API_URL=https://api.yktyyarchy.kg/api

      # Upload artifacts
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-${{ env.BUILD_NUMBER }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload Release AAB
        if: env.KEY_ALIAS != ''
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-${{ env.BUILD_NUMBER }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ──────────────────────────────────────────────
  # 4. Flutter Integration Tests
  # ──────────────────────────────────────────────
  flutter-integration-test:
    name: Flutter Integration Tests
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Run integration tests
        run: flutter test integration_test/
        continue-on-error: true

  # ──────────────────────────────────────────────
  # 3. Backend Tests (Django)
  # ──────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env for tests
        run: |
          cat > .env << EOF
          DEBUG=True
          SECRET_KEY=test-only-secret-key-not-for-production
          ALLOWED_HOSTS=localhost,127.0.0.1
          CORS_ALLOW_ALL_ORIGINS=True
          EMAIL_BACKEND=django.core.mail.backends.console.EmailBackend
          EOF

      - name: Run migrations
        run: python manage.py migrate --run-syncdb

      - name: Run flake8 linting
        run: flake8 apps/ --count --show-source --statistics

      - name: Run black check
        run: black --check apps/

      - name: Run isort check
        run: isort --check-only apps/

      - name: Run pytest with coverage
        run: pytest --cov --cov-report=xml --cov-report=term --ds=config.test_settings

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
        continue-on-error: true

      - name: Check coverage threshold
        run: |
          coverage report --fail-under=30
