# CI: тесты бэкенда (Django) и проверка Flutter на каждый push / PR
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          SECRET_KEY: ci-only-not-secret
          DEBUG: 'True'
          DB_ENGINE: django.db.backends.sqlite3
        run: python -m pytest -q
      - name: Django deploy checks
        env:
          SECRET_KEY: ci-only-not-secret-but-long-enough-for-the-deploy-check-123456
          DEBUG: 'False'
          DATABASE_URL: sqlite:///ci.sqlite3
          ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level ERROR

  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
