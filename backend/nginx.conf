# Nginx + CDN Configuration — Static Files & Media (#86)
# Save as /etc/nginx/sites-available/volunteers.kg and symlink to sites-enabled.
#
# CDN Strategy:
#  - Static assets (CSS/JS/fonts) → CloudFront or Cloudflare CDN via S3
#  - Media (user uploads)         → S3 private bucket + CloudFront signed URLs
#  - Django dynamic responses     → Gunicorn via Unix socket (no CDN)
#
# To enable CDN:
#  1. Set USE_S3=True and fill AWS_* vars in backend/.env
#  2. Point your CDN distribution origin to the S3 bucket
#  3. Set AWS_S3_CUSTOM_DOMAIN=<your-cdn-domain> in .env

# --------------------------------------------------------------------------
# Rate limiting zones
# --------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# --------------------------------------------------------------------------
# Redirect HTTP → HTTPS
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name volunteers.kg www.volunteers.kg;
    return 301 https://$host$request_uri;
}

# --------------------------------------------------------------------------
# Main HTTPS server
# --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name volunteers.kg www.volunteers.kg;

    # ---- TLS ----
    ssl_certificate     /etc/letsencrypt/live/volunteers.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/volunteers.kg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---- Security headers ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Gzip compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript application/javascript
        application/json application/xml image/svg+xml font/woff2;

    # ---- Static files (Django collectstatic output) ----
    # Long cache: fingerprinted filenames never collide.
    location /static/ {
        alias /srv/volunteers/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Serve pre-compressed .gz / .br if available.
        gzip_static on;
    }

    # ---- Media files (local fallback — prefer S3/CDN in production) ----
    location /media/ {
        alias /srv/volunteers/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---- API rate limiting ----
    location /api/v1/users/login/ {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://unix:/run/gunicorn/volunteers.sock;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://unix:/run/gunicorn/volunteers.sock;
        include /etc/nginx/proxy_params;
    }

    # ---- Django admin ----
    location /admin/ {
        proxy_pass http://unix:/run/gunicorn/volunteers.sock;
        include /etc/nginx/proxy_params;
        # Admin only accessible from known IPs.
        # allow 10.0.0.0/8;
        # deny all;
    }

    # ---- Everything else → Gunicorn ----
    location / {
        proxy_pass http://unix:/run/gunicorn/volunteers.sock;
        include /etc/nginx/proxy_params;
    }
}

