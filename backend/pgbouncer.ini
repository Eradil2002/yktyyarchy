# PgBouncer configuration — Database Connection Pooler (#87)
# Place this file at /etc/pgbouncer/pgbouncer.ini on the production server
# and run: sudo systemctl enable pgbouncer && sudo systemctl start pgbouncer

[databases]
# Route all connections to PostgreSQL via PgBouncer.
# Django connects to port 6432 (PgBouncer); PgBouncer connects to 5432 (Postgres).
volunteering_db = host=127.0.0.1 port=5432 dbname=volunteering_db

[pgbouncer]
# Listen on all interfaces on port 6432.
listen_port = 6432
listen_addr = *

# auth_type = md5 works with standard Django password-based auth.
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# ----- Pool mode -----
# transaction — recommended for Django with CONN_MAX_AGE=0.
# session    — use when Django has CONN_MAX_AGE > 0 (our current default).
pool_mode = session

# Maximum open connections to PostgreSQL from PgBouncer.
max_client_conn = 200
default_pool_size = 20
# Reserve pool for burst traffic.
reserve_pool_size = 5
reserve_pool_timeout = 3

# Idle connections are closed after this many seconds.
server_idle_timeout = 600
# Client connections are closed if idle for this many seconds.
client_idle_timeout = 60

# Logging (journald / syslog on Linux).
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

# Enable stats endpoint (accessible with psql on port 6432, database pgbouncer).
stats_users = pgbouncer_stats

# TLS (uncomment and configure in production).
# server_tls_sslmode = require
# server_tls_ca_file = /etc/ssl/certs/ca-certificates.crt
